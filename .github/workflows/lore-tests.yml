name: Lore ingestion tests
on:
  pull_request:
    paths:
      - 'tools/**'
      - '.github/workflows/lore-tests.yml'
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - '.github/workflows/lore-tests.yml'
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tools -p "test_*.py" -v
